name: 'Prepare Build Environment'
description: 'Checkout, install deps, setup python and npm'
inputs:
  python-version:
    description: 'Python version'
    default: '3.12'
  target:
    description: 'Canonical Windows target (x64, x86, or arm64)'
    required: true
runs:
  using: "composite"
  steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@v2
      with:
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        preinstalled-runtimes: false
        swap-storage: false

    - name: Deep Free Disk Space
      shell: bash
      run: |
        deleted_count=0
        skipped_count=0

        path_exists() {
          local p="$1"
          [ -e "$p" ] || [ -L "$p" ] || sudo test -e "$p" 2>/dev/null || sudo test -L "$p" 2>/dev/null
        }

        delete_path() {
          local pattern="$1"
          local matched=()
          local old_ifs="$IFS"
          IFS=$'\n'
          for item in $pattern; do
            if path_exists "$item"; then
              matched+=("$item")
            fi
          done
          IFS="$old_ifs"

          if [ ${#matched[@]} -eq 0 ]; then
            echo "  [SKIP] '$pattern' does not exist"
            skipped_count=$((skipped_count + 1))
          else
            for item in "${matched[@]}"; do
              echo "  [DELETE] Found '$item', deleting..."
              sudo rm -rf -- "$item"
              echo "  [DELETED] Successfully removed '$item'"
              deleted_count=$((deleted_count + 1))
            done
          fi
        }

        delete_path "/home/packer"
        delete_path "/opt/pipelinesagent-cache"
        delete_path "/opt/microsoft/msedge"
        delete_path "/opt/google/chrome"
        delete_path "/usr/lib/firefox"
        delete_path "/usr/local/share/chromium"
        delete_path "/usr/local/share/edge_driver"
        delete_path "/usr/local/share/chromedriver-linux64"
        delete_path "/usr/local/share/gecko_driver"
        delete_path "/usr/local/share/powershell"
        delete_path "/opt/microsoft/powershell"
        delete_path "/opt/az"
        delete_path "/usr/share/az_*"
        delete_path "/usr/local/bin/azcopy"
        delete_path "/usr/local/bin/bicep"
        delete_path "/usr/bin/kubectl*"
        delete_path "/usr/local/bin/minikube"
        delete_path "/usr/local/bin/packer"
        delete_path "/usr/local/bin/helm"
        delete_path "/usr/local/bin/kustomize"
        delete_path "/usr/local/bin/kind"
        delete_path "/usr/local/sessionmanagerplugin"
        delete_path "/usr/local/bin/session-manager-plugin"
        delete_path "/opt/pipx"
        delete_path "/usr/local/aws-cli"
        delete_path "/usr/local/aws-sam-cli"
        delete_path "/usr/libexec/buildah"
        delete_path "/usr/libexec/docker/cli-plugins"
        delete_path "/usr/bin/podman"
        delete_path "/usr/libexec/podman"
        delete_path "/usr/bin/buildah"
        delete_path "/usr/bin/skopeo"
        delete_path "/usr/lib/podman"
        delete_path "/home/linuxbrew"
        delete_path "/usr/local/share/vcpkg"
        delete_path "/usr/local/bin/stack"
        delete_path "/usr/lib/jvm"
        delete_path "/home/runner/.rustup"
        delete_path "/etc/skel/.rustup"
        delete_path "/home/runner/.cargo"
        delete_path "/etc/skel/.cargo"
        if [ -n "$HOME" ] && [ "$HOME" != "/home/runner" ] && [ "$HOME" != "/root" ]; then
          delete_path "$HOME/.rustup"
          delete_path "$HOME/.cargo"
        fi
        delete_path "/home/runner/.dotnet"
        delete_path "/root/.dotnet"
        delete_path "/etc/skel/.dotnet"
        if [ -n "$HOME" ] && [ "$HOME" != "/home/runner" ] && [ "$HOME" != "/root" ]; then
          delete_path "$HOME/.dotnet"
        fi
        delete_path "/usr/share/gradle-*"
        delete_path "/usr/share/kotlinc"
        delete_path "/usr/share/apache-maven-*"
        delete_path "/usr/local/bin/cmake*"
        delete_path "/usr/local/doc/cmake"
        delete_path "/usr/local/share/cmake-*"
        delete_path "/opt/hostedtoolcache/CodeQL"
        delete_path "/opt/hostedtoolcache/Ruby"
        delete_path "/opt/hostedtoolcache/copilot-cli"

        df -h /

        echo "Removed entries: $deleted_count"
        echo "Skipped entries (not found): $skipped_count"

    - name: Configure Swap Space
      shell: bash
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile /mnt/swapfile
        SWAP_SIZE_GB=30
        if ! sudo fallocate -l "${SWAP_SIZE_GB}G" /swapfile 2>/dev/null || ! sudo chmod 600 /swapfile || ! sudo mkswap /swapfile || ! sudo swapon /swapfile 2>/dev/null; then
          echo "fallocate swap activation failed or unsupported; falling back to dd allocation..."
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=$((SWAP_SIZE_GB * 1024)) status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
        fi
        free -h
        swapon --show

    - name: Install System Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y curl 7zip pkg-config libglib2.0-dev libfuse2t64 libnss3-dev libcups2-dev libpci-dev libdrm-dev libxkbcommon-dev gperf libkrb5-dev

    - name: Install LLVM Runtime Dependencies (libicu70)
      shell: bash
      run: |
        if ! ldconfig -p 2>/dev/null | grep 'libicui18n\.so\.70' >/dev/null 2>&1; then
          echo "Installing libicu70 for LLVM toolchain compatibility..."
          curl -fsSL --retry 3 --retry-connrefused http://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu70_70.1-2_amd64.deb -o /tmp/libicu70.deb
          sudo dpkg -i /tmp/libicu70.deb
          rm -f /tmp/libicu70.deb
        fi

    - name: Install 32-bit Development Libraries
      if: ${{ inputs.target == 'x86' }}
      shell: bash
      run: |
        echo "Installing 32-bit development libraries for x86 cross-compilation..."
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y libc6-dev-i386 linux-libc-dev:i386 gcc-multilib g++-multilib libglib2.0-0t64:i386 libnss3:i386 libnspr4:i386 libatk1.0-0t64:i386 libatk-bridge2.0-0t64:i386 libcups2t64:i386 libdrm2:i386 libdbus-1-3:i386 libexpat1:i386

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Stage Dependencies
      shell: bash
      run: npm install
      working-directory: ./.github/actions/stage
