name: reusable-build
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: false
        default: '3.12'
      target:
        type: string
        required: true

jobs:
  build-1:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: ./.github/actions/prepare
        with:
          target: ${{ inputs.target }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: false
          from_artifact: false
          target: ${{ inputs.target }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-2:
    needs: build-1
    if: needs.build-1.outputs.finished != 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: ./.github/actions/prepare
        with:
          target: ${{ inputs.target }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ join(needs.*.outputs.finished) }}
          from_artifact: true
          target: ${{ inputs.target }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-3:
    needs: build-2
    if: needs.build-2.outputs.finished != 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: ./.github/actions/prepare
        with:
          target: ${{ inputs.target }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ join(needs.*.outputs.finished) }}
          from_artifact: true
          target: ${{ inputs.target }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-4:
    needs: build-3
    if: needs.build-3.outputs.finished != 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: ./.github/actions/prepare
        with:
          target: ${{ inputs.target }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ join(needs.*.outputs.finished) }}
          from_artifact: true
          target: ${{ inputs.target }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-5:
    needs: build-4
    if: needs.build-4.outputs.finished != 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: ./.github/actions/prepare
        with:
          target: ${{ inputs.target }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ join(needs.*.outputs.finished) }}
          from_artifact: true
          target: ${{ inputs.target }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-6:
    needs: build-5
    if: needs.build-5.outputs.finished != 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: ./.github/actions/prepare
        with:
          target: ${{ inputs.target }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ join(needs.*.outputs.finished) }}
          from_artifact: true
          target: ${{ inputs.target }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-7:
    needs: build-6
    if: needs.build-6.outputs.finished != 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: ./.github/actions/prepare
        with:
          target: ${{ inputs.target }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ join(needs.*.outputs.finished) }}
          from_artifact: true
          target: ${{ inputs.target }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-8:
    needs: build-7
    if: needs.build-7.outputs.finished != 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: ./.github/actions/prepare
        with:
          target: ${{ inputs.target }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ join(needs.*.outputs.finished) }}
          from_artifact: true
          target: ${{ inputs.target }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  complete:
    needs: [build-1, build-2, build-3, build-4, build-5, build-6, build-7, build-8]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-26.04
    steps:
      - name: Ensure build finished
        run: |
          outputs=(
            "${{ needs.build-1.outputs.finished }}"
            "${{ needs.build-2.outputs.finished }}"
            "${{ needs.build-3.outputs.finished }}"
            "${{ needs.build-4.outputs.finished }}"
            "${{ needs.build-5.outputs.finished }}"
            "${{ needs.build-6.outputs.finished }}"
            "${{ needs.build-7.outputs.finished }}"
            "${{ needs.build-8.outputs.finished }}"
          )
          echo "Stage finished outputs: ${outputs[*]}"
          for out in "${outputs[@]}"; do
            if [ "$out" = "true" ]; then
              echo "Build verified completed successfully."
              exit 0
            fi
          done
          echo "Error: Build did not finish after 8 stages."
          exit 1
