# Pre-built Go toolchain.
# Required by third_party/dawn/tools/generate-sources-gn.py, which runs a Go
# program (third_party/dawn/src/cmd/gen/sources) to generate Tint sources.
# Normally fetched via CIPD (infra/3pp/tools/go/<host>, dawn_go_version in
# third_party/dawn/DEPS); provided here instead. Bump the version and hashes to
# match dawn_go_version when rolling Dawn.
#
# NOTE: This is a HOST build tool, not a target cross-compiler. The generator
# selects the binary by HOST architecture (cipd_deps.get_cipd_platform() ->
# platform.machine()), independent of the Chromium target arch. So all
# targets built on an x64 Linux host use go-x64 below; there is no 386 or
# arm64 Go entry because only an x64 Linux build host is supported.
[go-x64]
version = 1.26.10
url = https://go.dev/dl/go%(version)s.linux-amd64.tar.gz
download_filename = go-%(version)s.linux-amd64.tar.gz
sha256 = ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5
output_path = third_party/dawn/tools/golang/linux-amd64
strip_leading_dirs = go

