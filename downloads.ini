[esbuild]
version = 0.28.2
url = https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-%(version)s.tgz
download_filename = esbuild-linux-x64-%(version)s.tar.gz
sha256 = 9573bb2233aab0f9ea7647d5cca9726113cc1768de61d66b17267f4db84488f6
output_path = third_party/devtools-frontend/src/third_party/esbuild
strip_leading_dirs=package

# TypeScript Native Preview (tsgo), used by tools/typescript/ts_library.gni
# (WebUI and devtools-frontend). Normally fetched via CIPD
# (chromium/third_party/typescript/<host>, see the
# `src/third_party/typescript/linux-amd64/src` entry in DEPS); the upstream
# release is used here instead. Note that unlike the CIPD package, this is not
# pre-patched with Chromium's local modification to the bundled lib.dom.d.ts
# (see third_party/typescript/*/3pp/patches and windows-fix-typescript-lib-dom.patch).
# Only the linux-amd64 host binary is needed: tsgo.gni picks the platform
# directory by host_os alone (x86/arm64 targets still use the x64 host tool).
# Bump `version` to match the DEPS `version:2@<version>` tag when rolling.
[typescript]
version = 7.0.2
url = https://github.com/microsoft/TypeScript/releases/download/v%(version)s/typescript-linux-x64.tgz
download_filename = typescript-linux-x64-%(version)s.tar.gz
sha256 = 7ecad6f67377e831856367ab062ef394f21506a611405bf8ac0ff039348637d3
output_path = third_party/typescript/linux-amd64/src
strip_leading_dirs = package

